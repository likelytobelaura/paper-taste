# Where paper-taste looks for new research.
#
# tier: prior on how often a source publishes careful, original research.
#   1 = frontier-lab research blogs and researchers whose posts are routinely paper-grade
#   2 = solid research groups / technical writers
#   3 = mixed (product + research); only research-looking posts get through
# Feeds use type = "rss" (RSS or Atom). Sites without a feed use type = "html":
# the index page is scraped for links matching `link`, and each new post page is
# opened once to read its date and description.

[arxiv]
categories = ["cs.LG", "cs.CL", "cs.AI", "cs.CV", "stat.ML", "cs.NE", "cs.RO", "cs.MA"]
lookback_days = 4
# adjacent categories: only papers whose abstract is about ML/AI are kept
extra_categories = ["cs.IR", "cs.SD", "eess.AS", "eess.IV", "eess.SP", "cs.CR", "cs.HC", "cs.CY", "cs.DC",
                    "cs.SE", "cs.PL", "cs.GT", "cs.DS", "math.OC", "stat.ME", "q-bio.NC", "q-bio.QM",
                    "physics.comp-ph"]
# keep this fraction of each day's arXiv papers (by quality) in data/items
keep_fraction = 0.35

[blogs]
lookback_days = 21

# Community aggregators: free, unauthenticated; feed the same attention signal as X shares.
[aggregators]
lookback_days = 4
hacker_news = true
hn_min_points = 20
reddit = ["MachineLearning", "LocalLLaMA", "mlscaling", "reinforcementlearning", "computervision", "LanguageTechnology"]
lobsters = ["ai", "ml"]

# X / AI Twitter (see papertaste/xsource.py).
# Free by default: recap newsletters that read AI Twitter daily are scanned for the posts they
# link, and each post is resolved through api.fxtwitter.com (no auth) for its links and likes.
# Optional, paid: with X API credentials your own home timeline is read too. The X API bills per
# post read (~$0.005 each as of 2026): 200 posts/day is roughly $1/day.
[x]
enabled = true
curated = true
curated_lookback_days = 3
max_lookups = 300            # FxTwitter post lookups per run
max_posts = 200              # timeline posts per run (paid API), newest first; never re-reads
paper_max_age_days = 30      # shared arXiv papers older than this are ignored
min_sharers_new_blog = 2     # an untracked blog post needs this many sharers to be fetched
max_new_blogs = 15
public_handles = false       # true = store/display @handles of sharers (data/ is public)
# list_id = "123..."         # with X_BEARER_TOKEN: read this X List instead of a home timeline

[[x.curated_feeds]]
name = "AINews"              # smol.ai daily AI Twitter recap, now published inside Latent Space
